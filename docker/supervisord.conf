[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:php-fpm]
command=php-fpm --nodaemonize
priority=1
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/php-fpm.log
stderr_logfile=/var/log/supervisor/php-fpm-error.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
priority=2
autostart=true
autorestart=true
user=root
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx-error.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

# NOTE: The Laravel scheduler is deliberately NOT run here. It runs in the
# dedicated `timetracking_scheduler` container (see docker-compose*.yaml).
# Running it here as well means two `schedule:work` processes fire every
# command every minute — which double-dispatched the per-board report and
# sent two identical emails.
